# GraphQL schema for Lms.Edge.GraphQL. Contract v0.3 (2026-11-02).
# Book fields are final (DECISION-009): one-to-one with BooksDatasetClean.csv, Kaggle elvinrustam/books-dataset v3.
# Scalar names "Decimal" and "Date" are the contract names. The HotChocolate scalar
# bound to each one is pinned at implementation, so that values serialize as
# DECISION-005 (SP-1) requires:
#   Decimal = JSON number at the stored scale (e.g. 12.50)
#   Date    = "YYYY-MM-DD"
# No mutations (D-5). No subscriptions. Projection pushdown is not used (AP-8).

scalar Decimal
scalar Date

type Query {
  "Books ordered by bookId ascending. offset >= 0; limit 1..1000."
  books(offset: Int!, limit: Int!): [Book!]!

  "Members ordered by memberId ascending. offset >= 0; limit 1..1000."
  members(offset: Int!, limit: Int!): [Member!]!
}

"Full Book model; clients select fields. Field set = verified source columns."
type Book {
  bookId: Int!
  title: String!          # source: Title
  authors: String!        # source: Authors
  description: String     # source: Description
  category: String        # source: Category
  publisher: String       # source: Publisher
  price: Decimal          # source: Price Starting With ($)
  publishMonth: String    # source: Publish Date (Month)
  publishYear: Int        # source: Publish Date (Year)
}

type Member {
  memberId: Int!
  firstName: String!
  lastName: String!
  email: String!
  phoneNumber: String!
  address: String!
  "Loans of this member ordered by loanId ascending (batched DataLoader keyed by memberId)."
  loans: [Loan!]!
}

type Loan {
  loanId: Int!
  memberId: Int!
  bookId: Int!
  loanDate: Date!
  "null = not yet returned"
  returnDate: Date
  isReturned: Boolean!
  "The borrowed book (batched DataLoader keyed by bookId)."
  book: Book!
}
